name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide the others
      matrix:
        include:
          - name: Windows
            os: windows-2022
            cmake_args: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - name: macOS
            os: macos-15
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Linux
            os: ubuntu-24.04
            cmake_args: ""

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        env:
          EXTRA_ARGS: ${{ matrix.cmake_args }}
        run: |
          read -r -a extra <<< "$EXTRA_ARGS"
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${extra[@]+"${extra[@]}"}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Each platform builds an installer, then installs it to prove that it works.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = Get-Content build/version.txt
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = (Get-Item dist\*Setup.exe).FullName
          $target = "$env:RUNNER_TEMP\installed"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          if (-not (Test-Path "$target\Samplite Explorer.exe")) { throw "App was not installed" }

      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: |
          bash installer/macos.sh
          sudo installer -pkg dist/*.pkg -target /
          test -x "/Applications/Samplite Explorer.app/Contents/MacOS/Samplite Explorer"

      - name: Installer (Linux)
        if: runner.os == 'Linux'
        run: |
          bash installer/linux.sh
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/samplite-explorer
          ! ldd /usr/bin/samplite-explorer | grep "not found"

      - uses: actions/upload-artifact@v7
        with:
          name: Samplite-Explorer-Installer-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide the others
      matrix:
        include:
          - name: Windows
            os: windows-2022
            cmake_args: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - name: macOS
            os: macos-15
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Linux
            os: ubuntu-24.04
            cmake_args: ""

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        env:
          EXTRA_ARGS: ${{ matrix.cmake_args }}
        run: |
          read -r -a extra <<< "$EXTRA_ARGS"
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${extra[@]+"${extra[@]}"}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/SampliteExplorer_artefacts/Release/Samplite Explorer.exe" dist/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          app="build/SampliteExplorer_artefacts/Release/Samplite Explorer.app"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "dist/Samplite-Explorer-macOS.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/Samplite-Explorer-Linux.tar.gz -C build/SampliteExplorer_artefacts/Release "Samplite Explorer"

      - uses: actions/upload-artifact@v7
        with:
          name: Samplite-Explorer-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
